name: release

# Tag triggered releases (v*). Pull requests that touch the release pipeline
# only run the `validate` job: config check, a snapshot build and shellcheck.
# Nothing is published from a pull request.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - scripts/**
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1
      - name: shellcheck
        run: shellcheck -s sh scripts/*.sh
      - name: release notes exist for the newest changelog section
        run: |
          ver=$(awk '/^## /{print $2; exit}' CHANGELOG.md)
          sh scripts/release-notes.sh "v$ver" >/dev/null
      - name: changelog step must stay enabled
        # goreleaser loads --release-notes inside its changelog step; disabling
        # that step publishes a release with an empty body.
        run: |
          if awk '/^changelog:/{f=1;next} /^[^ #]/{f=0} f && /^[ ]+disable:/' .goreleaser.yaml | grep -q .; then
            echo "changelog.disable is set in .goreleaser.yaml: the release notes would be dropped"; exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=sign,publish

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless cosign signature and build provenance
      attestations: write # GitHub artifact attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is not reachable from main; refusing to release"; exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: tests
        run: go test ./...
      - name: release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: release body is the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          want=$(head -c 200 "$RUNNER_TEMP/release-notes.md" | tr -d '[:space:]')
          got=$(printf '%s' "$body" | head -c 400 | tr -d '[:space:]')
          case "$got" in
          *"$(printf '%s' "$want" | head -c 60)"*) echo "release body matches CHANGELOG.md" ;;
          *) echo "release body does not hold the CHANGELOG.md section"; exit 1 ;;
          esac
