name: vm-matrix

# The VM only test matrix for apply: official Ubuntu and Debian cloud
# images booted in QEMU (KVM when the runner offers it) inside a GitHub
# hosted runner, one throwaway VM per job. The runner reaches the VM only
# over SSH on 127.0.0.1, as an owner reaches a server: apply in one
# session, confirm from another, and fresh logins prove what still works
# after a rollback, a confirm and a reboot. See docs/testing.md.
on:
  pull_request:
    paths:
      - 'internal/apply/**'
      - 'internal/plan/**'
      - 'internal/cli/apply*.go'
      - 'internal/cli/txn*.go'
      - 'internal/cli/plan*.go'
      - 'cmd/**'
      - 'test/vm/**'
      - 'test/scenarios/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/vm-matrix.yml'
  schedule:
    # Weekly, Monday 05:17 UTC: new point releases of the images are
    # tested before anyone applies on one.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: shellcheck the VM scripts
        run: shellcheck -x -P SCRIPTDIR test/vm/*.sh
      - name: build (cgo free, as released)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/stackward ./cmd/stackward
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackward-vm-linux-amd64
          path: dist/stackward
          retention-days: 3
          if-no-files-found: error

  vm:
    needs: build
    runs-on: ubuntu-24.04
    # Sized for TCG, the fallback when the runner has no KVM; with KVM a
    # job takes a few minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13]
        scenario: [rollback, confirm, guard, accounts, rootonly]
    name: ${{ matrix.scenario }} (${{ matrix.distro }})
    # apply runs only inside the VM, where no CI variable reaches it over
    # SSH; the flag says this job owns a throwaway VM (see
    # internal/apply/cienv.go). The guard scenario sets GITHUB_ACTIONS
    # inside the VM itself to test the refusal.
    env:
      STACKWARD_CI_APPLY: throwaway-vm
    steps:
      - name: VM paths
        run: |
          {
            echo "VM_DIR=$RUNNER_TEMP/vm"
            echo "VM_CACHE=$RUNNER_TEMP/vm-cache"
            echo "OUT=$RUNNER_TEMP/vm-scenario-out"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stackward-vm-linux-amd64
          path: dist
      - name: install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          # Standard Linux runners expose /dev/kvm, readable by root only.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the VM runs under TCG"
      - name: resolve the ${{ matrix.distro }} image
        id: image
        run: test/vm/vm.sh resolve "${{ matrix.distro }}" | tee -a "$GITHUB_OUTPUT"
      - name: cache the image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.image.outputs.cache }}
          key: vm-image-${{ matrix.distro }}-${{ steps.image.outputs.sha }}
      - name: boot ${{ matrix.distro }}
        env:
          STACKWARD: ${{ github.workspace }}/dist/stackward
          SEED: ${{ matrix.scenario == 'accounts' && 'accounts' || matrix.scenario == 'rootonly' && 'root' || 'users' }}
        run: |
          chmod +x dist/stackward
          test/vm/vm.sh boot "${{ matrix.distro }}" "$SEED"
      - name: run ${{ matrix.scenario }}
        run: test/vm/run.sh "${{ matrix.scenario }}"
      - name: VM console
        if: failure()
        run: tail -100 "$VM_DIR/console.log" || true
      - name: stop the VM
        if: always()
        run: test/vm/vm.sh stop
      - name: upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-${{ matrix.scenario }}-${{ matrix.distro }}
          path: |
            ${{ runner.temp }}/vm-scenario-out
            ${{ runner.temp }}/vm/console.log
            ${{ runner.temp }}/vm/cloud-init.txt
          retention-days: 14
          if-no-files-found: warn

  # The weekly run opens one issue when the matrix fails, or adds a comment
  # to the one already open. Only this job may write issues.
  report:
    needs: vm
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly VM matrix failed"
          body="The weekly run of the VM matrix for apply failed: $RUN_URL

          Each failed job lists its failed assertions in the job summary, and its results are uploaded as an artifact. A new point release of a cloud image is a likely cause; see docs/testing.md to run the scenario locally."
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --label ci --label test --body "$body"
          fi
