name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: stackward-guard
        # Safety model in code: no filesystem writes, program starts or
        # network use outside the allowlist (internal/lint/guard/allowlist.go),
        # and no test file over 1000 lines of code. A plain go run instead of
        # a golangci-lint module plugin: no custom golangci-lint build to
        # keep in step with the pinned version, and the same command runs
        # locally.
        run: go run ./internal/lint/guard/cmd ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: go test -race
        run: go test -race ./...
      - name: sandbox test (cgo free, as released)
        # The race detector needs cgo, and Landlock on all threads needs a
        # cgo free build, so the real sandbox test runs separately.
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v -run 'TestApplyConfinesProcess|TestPlanUnderLandlock' ./internal/sandbox/ ./internal/cli/
      - name: cross build
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -o "dist/stackward-linux-$arch" ./cmd/stackward
          done
          file dist/*
      - name: self audit on the runner
        run: |
          set -euo pipefail
          # Runner images delete apt's binary caches; a real server keeps
          # them (apt update rebuilds them). Without them apt-get -s must
          # reparse the lists, which needs a temporary file the sandbox
          # refuses, so build them once like a server has them.
          sudo apt-cache gencaches
          bin=dist/stackward-linux-amd64
          "$bin" version
          set +e
          "$bin" audit --all; code=$?
          set -e
          echo "audit as user exited $code"
          [ "$code" -le 1 ]
          set +e
          sudo "$bin" audit --json > report.json; code=$?
          set -e
          echo "audit as root exited $code"
          [ "$code" -le 1 ]
          grep -A4 '"sandbox"' report.json
          if grep -q '"state": "failed"' report.json; then
            echo "sandbox failed to apply"; exit 1
          fi
      - name: self plan on the runner
        # stackward plan audits like audit, under the same sandbox, and
        # writes only the plan file it was given.
        run: |
          set -euo pipefail
          bin=dist/stackward-linux-amd64
          sudo "$bin" plan --out plan.json
          sudo "$bin" plan --emit-script > plan.sh
          sh -n plan.sh
          # --out is created 0600 by root.
          sudo jq -e '.schema == "stackward.plan.v1"' plan.json
          state="$(sudo jq -r '.sandbox.state' plan.json)"
          echo "plan sandbox state: $state"
          [ "$state" != "failed" ]
      - name: apply refuses in CI without the throwaway VM flag
        # This job does not own a throwaway VM for apply, so it never sets
        # STACKWARD_CI_APPLY. The plan file does not exist, so even a
        # broken gate could not change this runner: apply would stop at
        # the plan instead, which fails this step too.
        run: |
          set -euo pipefail
          bin=dist/stackward-linux-amd64
          for run in "" sudo; do
            set +e
            $run "$bin" apply --all-safe --yes /nonexistent/plan.json 2> refusal.txt; code=$?
            set -e
            cat refusal.txt
            echo "apply ${run:+with $run }exited $code"
            [ "$code" -eq 2 ]
            # sudo drops GITHUB_ACTIONS; apply finds it in the step's shell.
            grep -q 'looks like a CI job' refusal.txt
            grep -q 'STACKWARD_CI_APPLY=throwaway-vm' refusal.txt
          done
      - name: collectors work under the sandbox
        # A command that needs to write (ufw status opens /run/ufw.lock)
        # dies under the Landlock sandbox and leaves its collector partial,
        # which turns whole check groups unknown on real hosts. Run the same
        # audit as root without the sandbox and fail when a collector ends
        # worse with it, or reports a command that exited non zero only
        # under it. Unsupported kernels report the sandbox as unavailable
        # and are skipped.
        run: |
          set -euo pipefail
          bin=dist/stackward-linux-amd64
          state="$(jq -r '.coverage.sandbox.state' report.json)"
          echo "sandbox state: $state"
          if [ "$state" != "landlock" ]; then
            echo "sandbox not applied on this runner; nothing to compare"; exit 0
          fi
          set +e
          sudo "$bin" audit --json --no-sandbox > report-nosandbox.json; code=$?
          set -e
          [ "$code" -le 1 ]
          summary='[.coverage.collectors[] | {key: .name, value: {status, error: (.error // "")}}] | from_entries'
          jq "$summary" report.json > with.json
          jq "$summary" report-nosandbox.json > without.json
          jq -r -n --slurpfile w with.json --slurpfile wo without.json '
            $w[0] | to_entries[] | select(.value.status != "skipped")
            | "\(.key): sandbox \(.value.status), no sandbox \($wo[0][.key].status // "missing")"'
          bad="$(jq -r -n --slurpfile w with.json --slurpfile wo without.json '
            $w[0] | to_entries[]
            | select(
                (.value.status == "partial" or .value.status == "failed")
                and (($wo[0][.key].status // "") == "ok"
                     or ((.value.error | test("exit(ed)? -?[0-9]+"))
                         and (($wo[0][.key].error // "") | test("exit(ed)? -?[0-9]+") | not))))
            | "\(.key): \(.value.error)"')"
          if [ -n "$bad" ]; then
            echo "collectors that break only under the sandbox:"
            echo "$bad"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
